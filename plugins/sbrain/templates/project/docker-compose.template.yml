# docker-compose.yml — generated by sbrain bootstrap (Step 4b).
#
# `name:` reads COMPOSE_PROJECT_NAME from .env (compose's native .env interpolation)
# so multiple sbrain projects on the same machine never collide on container/network
# names. Each service below is guarded by the concern it belongs to — keep a service
# only if that concern is `Enabled? = yes` in ARCHITECTURE.md; delete it otherwise.
# An LDAP test server belongs in docker-compose.dev.yml (local development only),
# never here — production LDAP is an external server this file does not own.
# When a service is deleted, delete its volume entry too (e.g. drop `minio_data` from
# `volumes:` at the bottom if the minio service was removed) — a dangling volume
# definition for a service that doesn't exist is a bootstrap bug, not a harmless no-op.

name: ${COMPOSE_PROJECT_NAME}

services:
  # --- Core (always, stack-nestjs) ---
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: [db_name]
      POSTGRES_USER: [user]
      POSTGRES_PASSWORD: [password]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Cache / Queue (only if Cache = Redis, or Queue = BullMQ) ---
  redis:
    image: redis:7-alpine

  # --- §F File storage — MinIO (only if File storage = "MinIO self-hosted") ---
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
